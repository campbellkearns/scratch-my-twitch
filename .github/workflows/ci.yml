name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # tsc --noEmit has never run in CI for this repo before. Turning it on for the
        # first time surfaces ~30 pre-existing type errors unrelated to WebMCP (JSX
        # namespace resolution, repository/API type drift, ad-hoc console-test scripts
        # under src/lib/test/). Fixing that backlog is out of scope for the WebMCP CI
        # gate, so this step is non-blocking for now: it still runs and reports on every
        # PR (so new regressions are visible), but doesn't fail the gate until a
        # dedicated cleanup lands. Flip `continue-on-error` to false once that's done.
        run: npm run typecheck
        continue-on-error: true

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
