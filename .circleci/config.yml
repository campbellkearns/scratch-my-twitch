# Quality gate for stream-chameleon.
#
# GitHub Actions is unusable on this account (billing lock refuses to start
# jobs), so the same gate runs here instead: one job, one status check
# (`ci/quality`), on every branch push -- which covers PR checks plus pushes
# to main. Mirrors the retired .github/workflows/ci.yml:
# npm ci -> lint -> typecheck (non-blocking) -> vitest -> build -> e2e.
version: 2.1

jobs:
  quality:
    docker:
      - image: cimg/node:20.19.6
    steps:
      - checkout

      # Restore node_modules from the most recent cache whose lockfile
      # matches; fall back to any npm cache and let npm ci verify.
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
            - ~/.npm

      - run:
          name: Lint
          command: npm run lint

      - run:
          name: Typecheck (non-blocking)
          # tsc --noEmit already fails on a clean main with ~30 pre-existing
          # errors unrelated to WebMCP (JSX namespace resolution,
          # repository/API type drift, ad-hoc console-test scripts under
          # src/lib/test/). Keep the check visible in logs without failing
          # the gate until a dedicated cleanup lands -- see the PR body.
          command: npm run typecheck || echo "pre-existing typecheck errors -- documented in PR body"

      - run:
          name: Unit tests
          command: npm run test:unit

      - run:
          name: Build
          command: npm run build

      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps

      - run:
          name: E2E tests
          command: npm test

workflows:
  quality-gate:
    jobs:
      - quality
